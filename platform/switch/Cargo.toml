[package]
name = "vera20k-switch"
version = "0.1.0"
edition = "2024"
publish = false

# Keep Switch-only patches and its lockfile out of desktop builds.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[features]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:image", "dep:anyhow", "dep:log"]

[dependencies]
vera20k-core = { path = "../../src" }
rayon = "1.11"
wgpu = { version = "=27.0.1", optional = true, default-features = false, features = ["vulkan", "wgsl"] }
bytemuck = { version = "1", optional = true, features = ["derive"] }
# Keep the production shroud PNG diagnostic available without desktop codecs.
image = { version = "=0.25.9", optional = true, default-features = false, features = ["png"] }
anyhow = { version = "1", optional = true }
log = { version = "0.4", optional = true }

[profile.release]
panic = "abort"
opt-level = 2
debug = 1
