[package]
name = "vera20k-switch"
version = "0.1.0"
edition = "2024"
publish = false

# Keep Switch-only patches and its lockfile out of desktop builds.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
vera20k-core = { path = "../../src" }
rayon = "1.11"

[profile.release]
panic = "abort"
opt-level = 2
debug = 1
